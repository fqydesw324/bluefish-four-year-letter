<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">应用化学的四年旅程</title>
  <desc id="desc">一张暖色应用化学插画，包含烧瓶、分子结构、实验记录、数据曲线和从2026走向2030的路线。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F3E7"/>
      <stop offset=".55" stop-color="#F1E6D2"/>
      <stop offset="1" stop-color="#E6EBDD"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
